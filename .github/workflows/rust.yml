name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILD_TARGET: [release]
    outputs:
      release_built: ${{ steps.set-output.outputs.release_built }}
    steps:
    - uses: actions/checkout@v4
    - name: Install packages
      run: sudo apt-get update && sudo apt-get install -y libudev-dev
    - name: Configure toolchain
      run: rustup target add thumbv6m-none-eabi
    - name: Install elf converter
      run: cargo install --git https://github.com/JoNil/elf2uf2-rs.git --rev f14bf2d981772cd9fbe5bac33b685719caac1add
    - name: Build
      run: cargo build --profile ${{ matrix.BUILD_TARGET }} --verbose
    - name: Convert to UF2
      run: elf2uf2-rs convert --family rp2040 target/thumbv6m-none-eabi/release/rs-relayctl target/thumbv6m-none-eabi/release/rs-relayctl.uf2
    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: rs-relayctl.uf2
        path: target/thumbv6m-none-eabi/release/rs-relayctl.uf2
    - name: Create latest release
      uses: ncipollo/release-action@v1
      with:
        name: Latest
        tag: latest
        artifacts: "target/thumbv6m-none-eabi/release/rs-relayctl.uf2"
        token: ${{ secrets.GITHUB_TOKEN }}

    # - name: Run tests
    #   run: cargo test  --profile ${{ matrix.BUILD_TARGET }} --verbose
